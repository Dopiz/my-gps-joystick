name: Release

# 只在 GitHub 網頁手動觸發（Actions 分頁 → Release → Run workflow）。
# 觸發時填入版本號（例如 v1.0.0），流程會建 APK → 用該版本號建立 tag 與 GitHub Release
# （內建自動產生 changelog/release notes）→ 上傳 APK。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 / release tag（例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write  # 建立 tag / release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 讓 GitHub 能從完整歷史產生 release notes

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties 把 org.gradle.java.home 釘在本機 macOS 的 JDK 路徑，
      # 在 Linux runner 上不存在，移除該行改用 runner 的 JAVA_HOME（JDK 21）。
      - name: Unpin local JDK path for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK with version name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/gps-joystick-${{ inputs.version }}.apk"

      - name: Create GitHub Release with generated notes + APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}        # 用輸入的版本號建立 tag（不存在會自動從當前 commit 建立）
          name: ${{ inputs.version }}
          generate_release_notes: true            # GitHub 內建自動產生 changelog/release notes
          files: dist/gps-joystick-${{ inputs.version }}.apk
